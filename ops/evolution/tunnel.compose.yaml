name: bdb-evolution-public

services:
  proxy:
    image: nginx:stable-alpine@sha256:dc5069ad14f19660b141b21236140b91656bf89bbc3e2417c70ae650cd66104c
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    restart: unless-stopped
    mem_limit: 64m
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    volumes:
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - edge
      - evolution-egress

  cloudflared:
    image: cloudflare/cloudflared:2026.8.3@sha256:51c9cefcb4569df44e1ad403ab1d3d8065aa8e84339bcfc6aee75502e1140339
    user: "1000:1000"
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run", "--token-file", "/run/secrets/tunnel-token"]
    restart: unless-stopped
    mem_limit: 128m
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - type: bind
        source: ./tunnel-token
        target: /run/secrets/tunnel-token
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      proxy:
        condition: service_started
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "localhost:2000", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - edge
      - egress

networks:
  edge:
    internal: true
  egress:
    driver: bridge
  evolution-egress:
    external: true
    name: bdb-evolution_egress
